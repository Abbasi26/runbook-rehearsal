name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Offline demo
        run: rehearse demo --output rehearse-demo-out

      - name: Diff and init smoke test
        run: |
          rehearse check examples/demo/runbooks --config examples/demo/rehearse.yaml --output rehearse-check-out --baseline rehearse-demo-out/report.json --fail-on-regression
          rehearse diff rehearse-demo-out/report.json rehearse-check-out/report.json --format markdown
          rehearse init smoke-test-runbook --output smoke/smoke-test-runbook.yaml
          rehearse validate smoke/smoke-test-runbook.yaml
