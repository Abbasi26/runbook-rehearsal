[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbookrehearsal"
version = "0.1.0"
description = "Dry-run checks that keep incident and operations runbooks from going stale."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wasaf Abbasi" }]
keywords = ["runbook", "incident-response", "operations", "nis2"]
dependencies = [
  "PyYAML>=6.0.1",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
directory = ["ldap3>=2.9"]
dev = ["pytest>=8"]

[project.scripts]
rehearse = "rehearse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rehearse = ["py.typed", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
